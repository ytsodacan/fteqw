name: Build WASM/WebGL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    container:
      image: motolegacy/fteqw:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build dependencies (git, zip, unzip, wget)
        run: |
          set -eu
          missing=""
          for bin in git zip unzip wget; do
            command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"
          done
          if [ -n "$missing" ]; then
            echo "Container image is missing:$missing -- attempting to install via apt-get"
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends $missing
            else
              echo "No apt-get available in this container; build-nzp-web-package.sh will fall back to the official menu.dat if git is missing" >&2
            fi
          fi
          # Clones inside build-nzp-web-package.sh happen as whatever user this
          # container runs as, into a fresh tmp dir it owns, but set this anyway
          # in case the runner's git config is picky about the checked-out repo.
          git config --global --add safe.directory '*'

      - name: Build WebGL/WASM binaries
        run: |
          cd tools/
          chmod +x build-nzp-web-package.sh build-nzp-web.sh || true
          sh build-nzp-web-package.sh

      - name: Upload WebGL package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ftewebgl-web-package
          path: |
            ./engine/release/web/index.html
            ./engine/release/web/ftewebgl.html
            ./engine/release/web/ftewebgl.js
            ./engine/release/web/ftewebgl.wasm
            ./engine/release/web/ftewebgl.js.gz
            ./engine/release/web/ftewebgl.wasm.gz
            ./engine/release/web/default.fmf
            ./engine/release/web/nzportable.ico
            ./engine/release/web/nzp/game.pk3
            ./engine/release/web/nzp/progs.pk3

  deploy-wasm:
    # Only auto-deploy on real pushes to master, never on PRs from forks
    # (which don't have write access to this repo).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download WebGL package artifact
        uses: actions/download-artifact@v4
        with:
          name: ftewebgl-web-package
          path: ./deploy

      - name: Deploy to wasm branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: wasm
          publish_dir: ./deploy
          force_orphan: true
          commit_message: "Deploy WASM/WebGL build from ${{ github.sha }}"

